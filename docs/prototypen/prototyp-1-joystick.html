<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Prototyp 1 – Joystick</title>
<style>
:root{color-scheme:dark;--bg:#14161b;--panel:#1d2027;--line:#2c313b;--fg:#e8eaed;--acc:#ffb703}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh}
header{padding:8px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{background:#2a2f39;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit}
button:active{background:#3a4150}
.sw{display:flex;align-items:center;gap:8px;margin-right:auto}
.sw input{display:none}
.track{width:42px;height:24px;border-radius:12px;background:#444b58;position:relative;transition:.15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+.track{background:var(--acc)}
.sw input:checked+.track::after{left:21px}
#pal{display:flex;gap:6px;width:100%}
#pal button{flex:1;height:34px;padding:0;border-radius:6px}
#pal button.on{outline:3px solid var(--acc);outline-offset:1px}
#stage{flex:1;min-height:0;position:relative;display:grid;place-items:center;padding:8px}
#cv{display:block;border:1px solid var(--line)}
#loupe{position:absolute;top:10px;left:10px;width:108px;height:108px;border:2px solid var(--acc);border-radius:10px;pointer-events:none;background:#000}
#panel{height:190px;background:var(--panel);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:8px calc(8px + env(safe-area-inset-bottom))}
#joyWrap,#normalWrap{display:contents}
#joy{width:150px;height:150px;border-radius:50%;background:radial-gradient(#2a2f39,#1a1d24);border:2px solid var(--line);position:relative}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;background:#58627a;border:2px solid #8a94ad;transform:translate(-50%,-50%)}
#penBtn{width:110px;height:110px;border-radius:50%;font-size:15px;background:#8a2330;border:3px solid #e63946;color:#fff}
#penBtn.down{background:#e63946}
#normalWrap{display:none}
#normalWrap button{height:56px;width:70px;opacity:.6}
body.off #joyWrap{display:none}
body.off #normalWrap{display:contents}
body.off #loupe{display:none}
</style>
</head>
<body>
<header>
  <label class="sw"><input type="checkbox" id="prec" checked><span class="track"></span>Präzisionscursor</label>
  <button id="undo">↶ Rückgängig</button>
  <button id="clear">Leeren</button>
  <div id="pal"></div>
</header>
<div id="stage"><canvas id="cv"></canvas><canvas id="loupe"></canvas></div>
<div id="panel">
  <div id="joyWrap">
    <div id="joy"><div id="knob"></div></div>
    <button id="penBtn">✎ Zeichnen<br>AUS</button>
  </div>
  <div id="normalWrap">
    <button>Stift</button><button>Radierer</button><button>Füllen</button><button>Auswahl</button>
  </div>
</div>
<script>
const N=32, PAL=[null,'#111111','#ffffff','#e63946','#f4a261','#ffd60a','#2a9d8f','#4361ee','#9b5de5'];
const $=s=>document.querySelector(s);
const stage=$('#stage'),cv=$('#cv'),g=cv.getContext('2d'),lc=$('#loupe'),lg=lc.getContext('2d');
const joy=$('#joy'),knob=$('#knob'),penBtn=$('#penBtn');
let px=new Uint8Array(N*N),undo=[],color=1,cell=10,prec=true;
let fx=16,fy=16,pen=false,inStroke=false,lastPix=null,grab=null,jv={x:0,y:0};

// ---- Palette / Buttons
PAL.forEach((c,i)=>{const b=document.createElement('button');
  b.style.background=c||'repeating-conic-gradient(#555 0 25%,#888 0 50%) 50%/12px 12px';
  if(i===color)b.classList.add('on');
  b.onclick=()=>{color=i;document.querySelectorAll('#pal button').forEach(x=>x.classList.remove('on'));b.classList.add('on')};
  $('#pal').appendChild(b)});
$('#undo').onclick=()=>{const s=undo.pop();if(s)px.set(s)};
$('#clear').onclick=()=>{snapshot();px.fill(0)};
$('#prec').onchange=e=>{prec=e.target.checked;document.body.classList.toggle('off',!prec);setPen(false);jv={x:0,y:0}};

// ---- Zeichenlogik
function snapshot(){undo.push(px.slice());if(undo.length>100)undo.shift()}
function setPix(x,y){if(x<0||y<0||x>=N||y>=N)return;px[y*N+x]=color}
function line(x0,y0,x1,y1){const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;
  for(;;){setPix(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}
const cl=v=>Math.min(N-1e-6,Math.max(0,v));
const ipx=()=>[Math.floor(fx),Math.floor(fy)];
function moveTo(nx,ny){const [ox,oy]=ipx();fx=cl(nx);fy=cl(ny);if(pen){const [x,y]=ipx();line(ox,oy,x,y)}}

// ---- Zeichentaste (gedrückt halten)
function setPen(on){pen=on;penBtn.classList.toggle('down',on);
  penBtn.innerHTML=on?'✎ Zeichnen<br>AN':'✎ Zeichnen<br>AUS';
  if(on){snapshot();const [x,y]=ipx();setPix(x,y)}}
penBtn.addEventListener('pointerdown',()=>setPen(!pen));

// ---- Joystick
function jset(e){const r=joy.getBoundingClientRect(),R=r.width/2;
  let dx=(e.clientX-r.left-R)/R,dy=(e.clientY-r.top-R)/R;const m=Math.hypot(dx,dy)||1e-9;
  const mm=Math.min(1,m),ux=dx/m,uy=dy/m,dz=.1;
  const mag=Math.max(0,(mm-dz)/(1-dz));
  jv={x:ux*mag,y:uy*mag};
  knob.style.transform=`translate(calc(-50% + ${ux*mm*R*.62}px),calc(-50% + ${uy*mm*R*.62}px))`}
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);jset(e)});
joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))jset(e)});
const jend=()=>{jv={x:0,y:0};knob.style.transform='translate(-50%,-50%)'};
joy.addEventListener('pointerup',jend);joy.addEventListener('pointercancel',jend);

// ---- Direkt auf der Zeichenfläche
const cpos=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)/cell,(e.clientY-r.top)/cell]};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);const [x,y]=cpos(e);
  if(prec){
    // Cursor direkt anfassen: verschieben ohne zu zeichnen. Sonst: Cursor springt zum Finger.
    const d=Math.hypot(x-(Math.floor(fx)+.5),y-(Math.floor(fy)+.5))*cell;
    if(d<44){grab=[fx-x,fy-y]}else{grab=[0,0];moveTo(x,y)}
  }else{
    snapshot();inStroke=true;const ix=Math.floor(x),iy=Math.floor(y);setPix(ix,iy);lastPix=[ix,iy]}});
cv.addEventListener('pointermove',e=>{if(!cv.hasPointerCapture(e.pointerId))return;const [x,y]=cpos(e);
  if(prec){if(grab)moveTo(x+grab[0],y+grab[1])}
  else if(inStroke){const ix=Math.floor(x),iy=Math.floor(y);line(lastPix[0],lastPix[1],ix,iy);lastPix=[ix,iy]}});
const cUp=()=>{inStroke=false;grab=null};
cv.addEventListener('pointerup',cUp);cv.addEventListener('pointercancel',cUp);

// ---- Rendering
function drawCell(c,x,y,sz,ox,oy){
  if(x<0||y<0||x>=N||y>=N){c.fillStyle='#0c0d10';c.fillRect(ox,oy,sz,sz);return}
  c.fillStyle=((x+y)&1)?'#3a3f4a':'#2f343e';c.fillRect(ox,oy,sz,sz);
  const v=px[y*N+x];if(v){c.fillStyle=PAL[v];c.fillRect(ox,oy,sz,sz)}}
function layout(){const r=stage.getBoundingClientRect();
  cell=Math.max(4,Math.floor(Math.min(r.width-16,r.height-16)/N));
  const s=cell*N,d=devicePixelRatio||1;
  cv.style.width=cv.style.height=s+'px';cv.width=cv.height=Math.round(s*d);
  lc.width=lc.height=Math.round(108*d)}
function render(){const d=cv.width/(cell*N);g.setTransform(d,0,0,d,0,0);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++)drawCell(g,x,y,cell,x*cell,y*cell);
  if(!prec)return;
  const [ix,iy]=ipx(),x=ix*cell,y=iy*cell,a=cell*2.2,w=Math.max(2,cell/7);
  if(pen){g.fillStyle='rgba(230,57,70,.45)';g.fillRect(x,y,cell,cell)}
  for(const [col,lw] of [['#000',w+2],['#fff',w]]){g.strokeStyle=col;g.lineWidth=lw;
    g.strokeRect(x,y,cell,cell);g.beginPath();
    g.moveTo(x-a,y+cell/2);g.lineTo(x-cell*.3,y+cell/2);g.moveTo(x+cell*1.3,y+cell/2);g.lineTo(x+cell+a,y+cell/2);
    g.moveTo(x+cell/2,y-a);g.lineTo(x+cell/2,y-cell*.3);g.moveTo(x+cell/2,y+cell*1.3);g.lineTo(x+cell/2,y+cell+a);g.stroke()}
  // Lupe
  const dl=lc.width/108;lg.setTransform(dl,0,0,dl,0,0);
  for(let j=-4;j<=4;j++)for(let i=-4;i<=4;i++)drawCell(lg,ix+i,iy+j,12,(i+4)*12,(j+4)*12);
  lg.strokeStyle='#ffb703';lg.lineWidth=2;lg.strokeRect(4*12+1,4*12+1,10,10);
  // Lupe auf die andere Seite, wenn der Cursor darunter liegt
  const sr=stage.getBoundingClientRect(),cr=cv.getBoundingClientRect();
  const sx=cr.left-sr.left+x,sy=cr.top-sr.top+y,m=a+20;
  const hit=sx<10+108+m&&sy<10+108+m;
  lc.style.left=hit?'auto':'10px';lc.style.right=hit?'10px':'auto'}

let last=performance.now();
function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  const m=Math.hypot(jv.x,jv.y);
  if(prec&&m>0){const sp=14*m*m;moveTo(fx+jv.x/m*sp*dt,fy+jv.y/m*sp*dt)}
  render();requestAnimationFrame(tick)}
addEventListener('resize',layout);layout();requestAnimationFrame(tick);
</script>
</body>
</html>
